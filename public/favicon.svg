<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="tractorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" />

  <!-- Tractor Silouette Graphic -->
  <g transform="translate(6, 8)" filter="url(#glow)">
    <!-- Cabin Roof & Support -->
    <path d="M12 18 L24 18 L22 28 L10 28 Z" fill="#ffffff" fill-opacity="0.9" />
    <!-- Cabin Window -->
    <path d="M13 19.5 L22.5 19.5 L21 26.5 L12 26.5 Z" fill="#041f17" fill-opacity="0.6" />
    <!-- Exhaust Pipe & Hood -->
    <rect x="36" y="14" width="3" height="12" rx="1.5" fill="url(#goldGrad)" />
    <!-- Hood / Engine Bonnet -->
    <path d="M22 23 L42 24 C44 24 45 26 45 28 L45 34 L21 34 Z" fill="url(#tractorGrad)" />
    <!-- Front Grill / Headlight -->
    <circle cx="43.5" cy="28.5" r="2.5" fill="#fef08a" />
    <!-- Chassis Body -->
    <path d="M10 28 L30 28 L30 35 L8 35 Z" fill="#065f46" />
    
    <!-- Big Rear Wheel -->
    <circle cx="15" cy="37" r="11" fill="#1e293b" stroke="#34d399" stroke-width="2.5" />
    <circle cx="15" cy="37" r="5" fill="#f8fafc" />
    <circle cx="15" cy="37" r="2.5" fill="#0f172a" />
    <!-- Wheel Treads / Spokes -->
    <line x1="15" y1="26" x2="15" y2="30" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="44" x2="15" y2="48" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="37" x2="8" y2="37" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="37" x2="26" y2="37" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

    <!-- Small Front Wheel -->
    <circle cx="40" cy="40" r="7.5" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <circle cx="40" cy="40" r="3" fill="#f8fafc" />
    <circle cx="40" cy="40" r="1.5" fill="#0f172a" />

    <!-- Fresh Mint Sprout Leaf on Hood -->
    <path d="M38 15 C38 10 44 8 46 12 C44 15 40 15 38 15 Z" fill="#4ade80" />
    <path d="M38 15 C35 12 37 8 40 9 C40 12 39 14 38 15 Z" fill="#22c55e" />
  </g>
</svg>